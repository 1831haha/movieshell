name: Build MovieShell release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform + build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Python 3.10 (for Chaquopy build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # v0.27.3：release 包每轮构建现场生成 keystore（有效期 25 年）；
      # 密码取自 run_id，不提交到仓库；用户每版卸载重装，签名每轮不同无影响。
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias movieshell -keyalg RSA -keysize 2048 -validity 9125 \
            -storepass "release-${{ github.run_id }}-ms" \
            -keypass "release-${{ github.run_id }}-ms" \
            -dname "CN=MovieShell, OU=Dev, O=MovieShell, C=CN"

      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="release-${{ github.run_id }}-ms" \
            -Pandroid.injected.signing.key.alias=movieshell \
            -Pandroid.injected.signing.key.password="release-${{ github.run_id }}-ms"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movieshell-release-apk
          path: app/build/outputs/apk/release/*.apk
