name: Build MovieShell release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform + build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Python 3.10 (for Chaquopy build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Q4：CI 门槛——Kotlin 编译 + Android lint（abortOnError，对照 app/lint-baseline.xml，
      # 只有新增问题才报错）。任一不过整个 job 变红，后面不再打包上传。
      - name: Gate - compile + lint
        run: gradle :app:compileReleaseKotlin :app:lintRelease --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      # Q4：固定 release 签名——keystore 从仓库 Secrets 解码（不再每轮现场生成随机 key）。
      # Secrets：SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD。
      # 缺 Secrets 时：pull_request（含 fork PR，拿不到 Secrets）照常过门槛并出未签名包；
      # push / 手动触发直接失败并说明原因，绝不回退随机 key。
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$SIGNING_KEYSTORE_BASE64" ] || missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -n "$SIGNING_STORE_PASSWORD" ] || missing="$missing SIGNING_STORE_PASSWORD"
          [ -n "$SIGNING_KEY_ALIAS" ] || missing="$missing SIGNING_KEY_ALIAS"
          [ -n "$SIGNING_KEY_PASSWORD" ] || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::签名 Secrets 缺失（$missing），PR 构建只出未签名包。"
              exit 0
            fi
            echo "::error::签名 Secrets 缺失（$missing）。请在 Settings > Secrets and variables > Actions 添加后重跑；不会回退随机 key。"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      # v0.156.0：测试步骤失败不阻塞上传——Run unit tests 前置装 pycryptodome 时
      # Chaquopy 索引 chaquo.com 多次超时（run #337 两次同一失败），打包本身已通过；
      # 测试失败只记失败提示，不拦 Upload APK，否则有包也拿不到。
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movieshell-release-apk
          path: app/build/outputs/apk/release/*.apk

      # v0.30.0：构建字幕搜索插件 DEX（SubHdSource 实现，DEX 动态加载）
      - name: Build subtitle plugin DEX
        run: |
          gradle :plugin-subtitle:jar --no-daemon
          mkdir -p "$RUNNER_TEMP/subtitle-dex"
          "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --min-api 26 \
            --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
            --output "$RUNNER_TEMP/subtitle-dex" \
            plugin-subtitle/build/libs/plugin-subtitle.jar
          ls -la "$RUNNER_TEMP/subtitle-dex"

      - name: Upload subtitle plugin DEX
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-plugin-dex
          path: ${{ runner.temp }}/subtitle-dex/*.dex
