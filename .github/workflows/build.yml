name: Build MovieShell release APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "同时创建 GitHub Release 与 tag（只拿包验证时请关闭，避免误发版）"
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # v1.1.3：发 Release 需要写仓库内容（建 tag 与 Release），默认 token 权限不够。
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # v1.1.25：阿里云盘扫码登录的应用凭证（构建期注入；未配置时为空串，
      # 代码侧提示“未配置”。Secrets 在仓库 Settings → Secrets 里建，
      # 注册完成后填 ALIYUN_APP_ID / ALIYUN_APP_SECRET，凭证不进仓库。）
      ALIYUN_APP_ID: ${{ secrets.ALIYUN_APP_ID }}
      ALIYUN_APP_SECRET: ${{ secrets.ALIYUN_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # v1.1.9 分层门禁：拦两条红线——① 禁止引用已删空的 data/repo 包；
      # ② 禁止直接构造 OkHttpClient（统一走 core/net/HttpClient）。
      # 该 step 失败即构建失败；脚本默认全仓扫（CI 里工作区干净，
      # 只查 git 改动文件等于什么都不查）。
      - name: Check layer rules
        run: python3 tools/check_layers.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform + build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Python 3.10 (for Chaquopy build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # v1.2.14：固定签名——keystore 一次生成、存 GitHub Secrets（RELEASE_KEYSTORE_B64 /
      # RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_PASSWORD），每轮构建还原同一份；
      # 备份在工作区 ~/workspace/apk-signing/（600 权限，绝不进仓）。从这版起每版同一
      # 签名，可直接覆盖安装，不用再卸载。旧做法（每轮现场生成）见 git 历史。
      - name: Restore release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -la "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=movieshell \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"

      # v0.156.0：测试步骤失败不阻塞上传——Run unit tests 前置装 pycryptodome 时
      # Chaquopy 索引 chaquo.com 多次超时（run #337 两次同一失败），打包本身已通过；
      # 测试失败只记失败提示，不拦 Upload APK，否则有包也拿不到。
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: true

      # v1.1.3：改走 GitHub Release 出包，见文件末尾“Prepare release files / Publish release”
      # 两步（放 DEX 构建之后，DEX 也要一并挂上去）。

      # v0.30.0：构建字幕搜索插件 DEX（SubHdSource 实现，DEX 动态加载）
      - name: Build subtitle plugin DEX
        run: |
          gradle :plugin-subtitle:jar --no-daemon
          mkdir -p "$RUNNER_TEMP/subtitle-dex"
          "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --min-api 26 \
            --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
            --output "$RUNNER_TEMP/subtitle-dex" \
            plugin-subtitle/build/libs/plugin-subtitle.jar
          ls -la "$RUNNER_TEMP/subtitle-dex"

      # v1.1.3：改走 GitHub Release 出包——Release 附件不占 Actions 500MB 配额
      # （官方文档：单文件限 2GB，总大小与流量不限；仓库 v0.294.35–v0.294.44 本就是 prerelease 出包）。
      # 只在手动触发时发版，避免合 main 后重复建同一个 tag 冲突。
      # APK 按版本号改名（movieshell-v<版本>.apk），DEX 一并挂上去。
      - name: Prepare release files
        id: release
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-files
          for f in app/build/outputs/apk/release/*.apk; do cp "$f" "release-files/movieshell-v$VERSION.apk"; done
          cp "$RUNNER_TEMP/subtitle-dex/"*.dex release-files/ 2>/dev/null || true

      # v1.3.22：workflow_dispatch 默认仍发版（与既有手动出包习惯一致）；
      # publish_release=false 时只上传签名 APK 作为 Actions artifact，不建 tag / Release。
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          prerelease: true
          files: release-files/*

      - name: Upload signed APK artifact
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: movieshell-release-apk
          path: release-files/*
          if-no-files-found: error
          retention-days: 14
